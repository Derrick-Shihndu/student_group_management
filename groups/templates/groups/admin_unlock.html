{% extends 'groups/base.html' %}
{% block content %}
<h1>Admin Unlock</h1>
<p>Enter master password to unlock admin controls.</p>
<form method="post">
  {% csrf_token %}
  <input type="password" name="password" placeholder="Enter admin password" required>
  <button class="btn" type="submit">Unlock Admin</button>
</form>
{% if error %}
  <p class="small" style="color:#c00">{{ error }}</p>
{% endif %}
{% endblock %}
