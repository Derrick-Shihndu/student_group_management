services:
  - type: web
    name: student-group-manager
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn student_group_system.wsgi:application"

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: student_group_system.settings
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: student-group-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False

databases:
  - name: student-group-db
    plan: free
